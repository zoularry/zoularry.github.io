<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>redirecting...</title>
    <script type="text/javascript">
        // 1. 定义路由表 (后续新增短链只需在这里加一行)
        const routes = {
            "help": "https://hdsmth.site/hs_help",
            "move": "https://hdsmth.site/move_data",
            "old": "https://www.apkmirror.com/apk/colifer-lab/hide-something-photos-videos/#all_versions"
        };

        // 2. 获取 Hash 值，并去除开头的 '#' (例如 "#help" 变成 "help")
        const key = window.location.hash.substring(1);

        // 3. 执行匹配与跳转
        if (routes[key]) {
            // 使用 replace 而不是 href，这样可以避免污染浏览器的历史记录，
            // 用户点击“后退”按钮时，不会再次陷入重定向循环。
            window.location.replace(routes[key]);
        } else {
            // 4. 兜底逻辑：如果找不到对应的短链，跳回主页或显示 404
            window.location.replace("https://hdsmth.site");
        }
    </script>
</head>

<body>
    <p>redirecting...</p>
</body>

</html>
