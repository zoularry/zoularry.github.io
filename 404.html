<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Device | Hide Something</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg-primary: #0a2e29;
            --color-bg-secondary: #071f1b;
            --color-accent-teal: #20c997;
            --color-accent-bright: #34e7e4;
            --color-text-main: #f8f9fa;
            --color-text-muted: #a0aec0;
            --color-glass-bg: rgba(255, 255, 255, 0.04);
            --color-glass-border: rgba(255, 255, 255, 0.08);
            --radius-card: 24px;
            --radius-full: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg-primary);
            color: var(--color-text-main);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image:
                radial-gradient(circle at 10% 15%, rgba(32, 201, 151, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(52, 231, 228, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, var(--color-bg-primary) 0%, var(--color-bg-secondary) 100%);
        }

        /* 极简居中卡片 (无图片依赖) */
        .container {
            text-align: center;
            padding: 3rem 2.2rem;
            background: var(--color-glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--color-glass-border);
            border-radius: var(--radius-card);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            max-width: 420px;
            width: 100%;
            transition: all 0.3s ease;
        }

        /* 极简文本品牌字 */
        .brand-mark {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1.35rem;
            color: var(--color-accent-teal);
            letter-spacing: -0.5px;
            margin-bottom: 2rem;
            display: inline-block;
            text-decoration: none;
            opacity: 0.95;
            transition: opacity 0.2s ease;
        }

        .brand-mark span {
            color: var(--color-text-main);
        }

        .brand-mark:hover {
            opacity: 1;
        }

        /* 纯 CSS 环形加载微动效 */
        .loader-wrapper {
            margin: 0 auto 1.75rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader {
            border: 2.5px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--color-accent-teal);
            border-right-color: var(--color-accent-bright);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 状态标题与说明 */
        h2 {
            font-family: 'Nunito', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--color-text-main);
            margin-bottom: 0.6rem;
            letter-spacing: -0.3px;
        }

        p {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0;
            font-weight: 400;
        }

        /* 错误状态样式 */
        .error-code {
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            line-height: 1;
            color: var(--color-accent-bright);
            margin-bottom: 0.75rem;
            opacity: 0.9;
        }

        /* 兜底返回主页操作 */
        .action-group {
            display: none;
            margin-top: 2rem;
        }

        .btn-home {
            display: inline-block;
            padding: 0.75rem 1.8rem;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--color-accent-teal) 0%, var(--color-accent-bright) 100%);
            color: var(--color-bg-primary);
            text-decoration: none;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 0.92rem;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(32, 201, 151, 0.25);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(32, 201, 151, 0.35);
            filter: brightness(1.05);
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 获取路径并移除前导斜杠
            const path = window.location.pathname.replace(/^\/+/, '');
            
            const titleEl = document.getElementById('status-title');
            const descEl = document.getElementById('status-desc');
            const loaderWrapper = document.getElementById('loader-wrapper');
            const actionGroup = document.getElementById('action-group');
            const errorCodeEl = document.getElementById('error-code');
            let targetIp = "";

            // 路由逻辑推导
            if (/^0\d+$/.test(path)) {
                // 规则 1: 0开头 (如 031) -> 192.168.0.31
                const suffix = parseInt(path, 10);
                targetIp = `192.168.0.${suffix}`;
            } else if (/^\d+$/.test(path)) {
                // 规则 2: 纯数字 (如 31) -> 192.168.1.31
                targetIp = `192.168.1.${path}`;
            } else if (/^\d+(\.\d+)+$/.test(path)) {
                // 规则 3: 带点的路径 (如 3.31) -> 192.168.3.31
                targetIp = `192.168.${path}`;
            }

            if (targetIp) {
                // 找到对应局域网设备，执行跳转
                const targetUrl = `http://${targetIp}:9999`;
                window.location.replace(targetUrl);
            } else {
                // 无法识别的路径，切换为极简 404 状态
                document.title = "404 Not Found | Hide Something";
                loaderWrapper.style.display = 'none';
                errorCodeEl.style.display = 'block';
                titleEl.textContent = "Page Not Found";
                descEl.textContent = "The requested link is unavailable or the code is invalid. Check the address in your app or return to homepage.";
                actionGroup.style.display = 'block';
            }
        });
    </script>
</head>
<body>
    <main class="container">
        <a href="/" class="brand-mark" title="Hide Something">
            Hide<span>Something</span>
        </a>

        <div class="loader-wrapper" id="loader-wrapper">
            <div class="loader"></div>
        </div>

        <div class="error-code" id="error-code" style="display: none;">404</div>

        <h2 id="status-title">Connecting to device...</h2>
        <p id="status-desc">Redirecting to your local network. Make sure this computer is on the same Wi-Fi.</p>

        <div class="action-group" id="action-group">
            <a href="/" class="btn-home">Back to Home</a>
        </div>
    </main>
</body>
</html>
